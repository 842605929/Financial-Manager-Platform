name: AssetTracker
options:
  bundleIdPrefix: com.xuyuan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AssetTracker:
    type: application
    platform: iOS
    sources:
      - path: AssetTracker
    info:
      path: AssetTracker/Info.plist
      properties:
        CFBundleDisplayName: 资产
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            hq.sinajs.cn:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuyuan.assettracker
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  AssetTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AssetTrackerTests
    dependencies:
      - target: AssetTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuyuan.assettracker.tests
